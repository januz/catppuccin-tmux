# vim:set ft=tmux:

# --> Nord (https://www.nordtheme.com)
#
# Hex values are intentionally lowercase: tmux's -F format flag treats
# `#D`, `#H`, `#W`, etc. as format directives (pane_id, host, etc.) and
# would eat the leading byte of any value starting with `#<uppercase>`.
# Lowercase hex sidesteps the problem.
set -ogq @thm_bg "#2e3440"
set -ogq @thm_fg "#d8dee9"

# Colors (Catppuccin accent names mapped to Nord Aurora/Frost palette)
set -ogq @thm_rosewater "#ebcb8b"
set -ogq @thm_flamingo "#d08770"
set -ogq @thm_pink "#b48ead"
set -ogq @thm_mauve "#b48ead"
set -ogq @thm_red "#bf616a"
set -ogq @thm_maroon "#bf616a"
set -ogq @thm_peach "#d08770"
set -ogq @thm_yellow "#ebcb8b"
set -ogq @thm_green "#a3be8c"
set -ogq @thm_teal "#8fbcbb"
set -ogq @thm_sky "#88c0d0"
set -ogq @thm_sapphire "#88c0d0"
set -ogq @thm_blue "#81a1c1"
set -ogq @thm_lavender "#b48ead"

# Surfaces and overlays (mapped to Nord Polar Night + Snow Storm)
set -ogq @thm_subtext_1 "#e5e9f0"
set -ogq @thm_subtext_0 "#d8dee9"
set -ogq @thm_overlay_2 "#4c566a"
set -ogq @thm_overlay_1 "#4c566a"
set -ogq @thm_overlay_0 "#4c566a"
set -ogq @thm_surface_2 "#4c566a"
set -ogq @thm_surface_1 "#434c5e"
set -ogq @thm_surface_0 "#3b4252"
set -ogq @thm_mantle "#2e3440"
set -ogq @thm_crust "#2e3440"
